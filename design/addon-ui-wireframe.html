<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forever Route Companion 1.0 - Actual UI Wireframe</title>
  <style>
    html, body { margin: 0; background: #0a0e15; color: #e8edf7; font-family: Inter, Arial, sans-serif; }
    body { display: grid; place-items: start center; padding: 0; }
    svg { display: block; width: 1900px; height: 1320px; background: #0a0e15; }
    .frame { fill: #0c121d; stroke: #526073; stroke-width: 2; }
    .surface { fill: #121b29; stroke: #354257; stroke-width: 1.5; }
    .surface2 { fill: #172233; stroke: #40506a; stroke-width: 1.5; }
    .active { fill: #2c2412; stroke: #e9ad3b; stroke-width: 2; }
    .telemetry { fill: #101b2d; stroke: #4b9bff; stroke-width: 2; }
    .ready { fill: #10241a; stroke: #4fc97b; stroke-width: 2; }
    .warn { fill: #281418; stroke: #f16a6a; stroke-width: 2; }
    .line { stroke: #354257; stroke-width: 1.5; }
    .goldline { stroke: #e9ad3b; stroke-width: 3; }
    .t { fill: #e8edf7; font-size: 16px; }
    .small { fill: #9aa8bb; font-size: 13px; }
    .tiny { fill: #78889f; font-size: 11px; }
    .label { fill: #e9ad3b; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
    .h1 { fill: #f5f7fb; font-size: 30px; font-weight: 800; }
    .h2 { fill: #f5f7fb; font-size: 20px; font-weight: 750; }
    .value { fill: #f5f7fb; font-size: 22px; font-weight: 800; }
    .blue { fill: #66aaff; }
    .green { fill: #56d184; }
    .red { fill: #ff7474; }
    .gold { fill: #e9ad3b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
<svg viewBox="0 0 1900 1320" role="img" aria-label="Actual addon layout wireframe for Forever Route Companion">
  <rect x="0" y="0" width="1900" height="1320" fill="#0a0e15"/>

  <g transform="translate(1450,42)">

    <text x="60" y="32" class="h2">FOREVER INTELLIGENCE</text>
    <text x="60" y="52" class="small">Character · leveling · gear · group telemetry</text>
    <text x="830" y="35" class="small green">● LOCAL ONLY</text>
    <rect x="930" y="15" width="24" height="24" rx="3" class="surface2"/><text x="938" y="33" class="small">×</text>

    <!-- left rail 116/760 proportion -->
    <rect x="15" y="72" width="148" height="575" rx="5" fill="#0e1622" stroke="#354257" stroke-width="1.5"/>

      <rect x="0" y="0" width="128" height="48" rx="4" class="active"/><text x="14" y="29" class="t gold">◆  NOW</text>

      <g transform="translate(0,62)">

      <rect x="247" y="430" width="236" height="38" rx="4" class="surface2"/><text x="290" y="455" class="t">Export telemetry</text>
      <text x="0" y="502" class="label red">MISSING DUNGEON QUESTS</text>
      <rect x="0" y="515" width="766" height="52" rx="4" class="warn"/>
      <text x="15" y="538" class="small">In the Name of the Light · Brother Paxton</text>
      <text x="15" y="558" class="small">Vorrel's Revenge · Vorrel Sengutz</text>
    </g>
  </g>

  <!-- HUD actual proportions -->
  <g transform="translate(54,835)">

    <rect x="0" y="0" width="520" height="88" rx="6" class="frame"/>

      <text x="146" y="32" class="h2">Thalion · Dreamscythe</text><text x="146" y="53" class="small">PALADIN · HOLY · Scarlet Monastery</text>

        <rect x="456" y="0" width="142" height="58" rx="4" class="surface"/><text x="468" y="20" class="label">DURABILITY</text><text x="468" y="46" class="value">87%</text>

        </g>
      </g>
    </g>

    <g transform="translate(0,282)">
      <rect x="0" y="0" width="780" height="264" rx="7" class="frame"/>
      <rect x="0" y="0" width="126" height="264" rx="7" fill="#0e1622" stroke="#354257"/>

  <text x="54" y="1280" class="tiny">Wireframe reflects the current Lua implementation: exact screen hierarchy and relative proportions, not an aspirational redesign.</text>
</svg>
